name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: .exe
          - os: ubuntu-latest
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Formatação
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Testes
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked --bins --examples

      # Executa as leituras de verdade no runner: sem GPU nem LibreHardwareMonitor
      # elas devem falhar com mensagem, nunca travar ou entrar em pânico.
      - name: Diagnóstico (smoke test)
        timeout-minutes: 2
        run: ./target/release/examples/diagnostico${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ runner.os }}
          path: |
            target/release/monitor${{ matrix.exe }}
            target/release/examples/diagnostico${{ matrix.exe }}
