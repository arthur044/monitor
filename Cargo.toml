[package]
name = "monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Monitor de desempenho e serviços para Windows e Linux"
license-file = "LICENSE"

[dependencies]
anyhow = "1"
eframe = "0.36"
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.25"

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
wmi = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
